<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Detri Susilawati</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600;1,700&family=Quicksand:wght@500;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="splash" role="button" tabindex="0" aria-label="Ketuk untuk membuka kejutan">
  <div class="gift" aria-hidden="true">🎁</div>
  <p class="sp1">Ada kejutan buat kamu…</p>
  <p class="sp2">Ketuk untuk membuka 💌</p>
</div>
<main>
  <div class="bunting" aria-hidden="true"><span>🎀</span><span>🤍</span><span>🎀</span><span>🤍</span><span>🎀</span><span>🤍</span><span>🎀</span></div>
  <h1>Selamat Ulang Tahun!</h1>
  <p class="name" id="nm"></p>
  <p class="sub">Hari ini kamu jadi tuan putri sedunia 👑</p>
  <div class="garland" id="garland"></div>

  <div class="stage" id="stage">
    <svg id="cake" viewBox="0 0 200 190" role="img" aria-label="Kue ulang tahun, ketuk untuk meniup lilin">
      <ellipse cx="100" cy="176" rx="92" ry="11" fill="#f3c6dc"/>
      <ellipse cx="100" cy="172" rx="92" ry="11" fill="#fff"/>
      <rect x="22" y="112" width="156" height="58" rx="14" fill="#ffb3d1"/>
      <path d="M22 126q13 16 26 0t26 0 26 0 26 0 26 0 26 0v-14a14 14 0 0 0-14-14H36a14 14 0 0 0-14 14z" fill="#fff"/>
      <circle cx="46" cy="148" r="5" fill="#fff"/><circle cx="82" cy="154" r="5" fill="#fff"/><circle cx="118" cy="148" r="5" fill="#fff"/><circle cx="154" cy="154" r="5" fill="#fff"/>
      <rect x="48" y="68" width="104" height="48" rx="12" fill="#d9bdfa"/>
      <path d="M48 82q13 14 26 0t26 0 26 0 26 0v-8a12 12 0 0 0-12-12H60a12 12 0 0 0-12 12z" fill="#fff"/>
      <circle cx="76" cy="102" r="4" fill="#fff"/><circle cx="104" cy="106" r="4" fill="#fff"/><circle cx="128" cy="100" r="4" fill="#fff"/>
      <g id="candles">
        <rect x="74" y="42" width="8" height="26" rx="3" fill="#ff8fb8"/><rect x="96" y="38" width="8" height="30" rx="3" fill="#fff4a8"/><rect x="118" y="42" width="8" height="26" rx="3" fill="#8fd8ff"/>
        <g class="fl" transform="translate(78 41)"><circle class="glow" r="9" cy="-9" fill="#ffd27a" opacity=".3"/><path class="flame" d="M0 0C-5-4-5-10 0-17 5-10 5-4 0 0Z" fill="#ffb347"/><path class="flame" d="M0 0C-2.5-2-2.5-5 0-9 2.5-5 2.5-2 0 0Z" fill="#fff3b0"/></g>
        <g class="fl" transform="translate(100 37)"><circle class="glow" r="9" cy="-9" fill="#ffd27a" opacity=".3"/><path class="flame" d="M0 0C-5-4-5-10 0-17 5-10 5-4 0 0Z" fill="#ffb347"/><path class="flame" d="M0 0C-2.5-2-2.5-5 0-9 2.5-5 2.5-2 0 0Z" fill="#fff3b0"/></g>
        <g class="fl" transform="translate(122 41)"><circle class="glow" r="9" cy="-9" fill="#ffd27a" opacity=".3"/><path class="flame" d="M0 0C-5-4-5-10 0-17 5-10 5-4 0 0Z" fill="#ffb347"/><path class="flame" d="M0 0C-2.5-2-2.5-5 0-9 2.5-5 2.5-2 0 0Z" fill="#fff3b0"/></g>
        </g>
      <text x="26" y="108" font-size="16">🍓</text><text x="154" y="108" font-size="16">🍒</text>
    </svg>
  </div>
  <p class="hint" id="hint">Ketuk kuenya buat tiup lilin 🕯️</p>
  <svg id="bouquet" viewBox="0 0 160 170" role="img" aria-label="Buket bunga, ketuk untuk kejutan">
    <defs><g id="rs"><circle r="18" fill="currentColor"/><path d="M-9-2a9 9 0 0 1 16-5M-4 7a9 9 0 0 1-7-10M3-11a13 13 0 0 1 12 12" fill="none" stroke="#fff6e3" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/><circle r="4" fill="#fff6e3" fill-opacity=".35"/></g></defs>
    <g fill="#7d9160"><ellipse cx="38" cy="64" rx="8" ry="20" transform="rotate(-55 38 64)"/><ellipse cx="122" cy="64" rx="8" ry="20" transform="rotate(55 122 64)"/><ellipse cx="80" cy="24" rx="7" ry="16"/></g>
    <g fill="#fff6e3"><circle cx="34" cy="86" r="3"/><circle cx="46" cy="40" r="3"/><circle cx="116" cy="38" r="3"/><circle cx="128" cy="88" r="3"/><circle cx="80" cy="14" r="3"/></g>
    <use href="#rs" transform="translate(52 66)" style="color:#8b2635"/><use href="#rs" transform="translate(108 66)" style="color:#a8434f"/>
    <use href="#rs" transform="translate(80 48) scale(1.25)" style="color:#6d1f2f"/>
    <use href="#rs" transform="translate(64 92) scale(.9)" style="color:#e9c58c"/><use href="#rs" transform="translate(96 92) scale(.9)" style="color:#e8a8a0"/>
    <path d="M80 168 30 86Q80 116 130 86Z" fill="#fff6e3" stroke="#d9bd8d" stroke-width="2" stroke-linejoin="round"/>
    <path d="M80 168 48 100Q80 122 112 100Z" fill="#b0505c" stroke="#8b2635" stroke-width="2" stroke-linejoin="round"/>
    <g transform="translate(80 128)"><path d="M0 0-20-10-20 10ZM0 0 20-10 20 10Z" fill="#c9a46b"/><circle r="5" fill="#a67c37"/></g>
  </svg>
  <p class="hint" id="bqhint">Ketuk buketnya 💐</p>

  <div class="cards">
    <button class="card" data-open="letter"><span class="ic">💌</span>Surat<small>untukmu</small></button>
    <button class="card" data-open="photo"><span class="ic">📸</span>Foto<small>si lucu</small></button>
    <button class="card" data-open="music"><span class="ic">🎵</span>Musik<small>putar yuk</small></button>
    <button class="card" data-open="game"><span class="ic">🎮</span>Game<small>seru-seruan</small></button>
  </div>
</main>

<div id="modal" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>

<div id="game" aria-label="Mini game">
  <canvas id="gc"></canvas>
  <div id="gui"><span id="gs">Skor 0/25</span><span class="sp0"></span><span id="gl">❤️❤️❤️</span><button class="x" id="gx" aria-label="Tutup game">✕</button></div>
  <div id="gmsg" class="hide"></div>
</div>
<script src="js/config.js"></script>
<script src="js/script.js"></script>
</body>
</html>
